# Fly.io deployment.
#
#   fly launch --no-deploy --copy-config
#   fly ips allocate-v4          # a DEDICATED v4 address is required for UDP
#   fly deploy
#
# The server takes TCP and UDP on one port: TCP for every node's control
# connection and the TCP relay, UDP for datagram channels (WhoAmI and the UDP
# relay). Fly carries both, but two things make it different from a plain VPS,
# and both will silently produce a server that looks healthy and answers
# nothing over UDP:
#
#  1. UDP requires a DEDICATED IPv4 address. The shared v4 address Fly hands out
#     by default is HTTP-only.
#  2. The process must bind to the special `fly-global-services` address for
#     UDP, not to 0.0.0.0. That is what the --bind flag in CMD below is for.
#
# The TCP service below has no handlers: the control protocol is raw TCP, and
# Fly's HTTP or TLS handlers would mangle it.

app = "uconnect-rendezvous"
primary_region = "ams"

[build]
  dockerfile = "../Dockerfile"

[[services]]
  protocol     = "tcp"
  internal_port = 4433

  [[services.ports]]
    port = 4433

[[services]]
  protocol     = "udp"
  internal_port = 4433

  [[services.ports]]
    port = 4433

# Records live only as long as their node's control connection, so there is no
# volume, no database and nothing to migrate. A restart just means every live
# node reconnects and registers again.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Fly routes UDP only to this address, not to 0.0.0.0.
[experimental]
  cmd = ["--port", "4433", "--bind", "fly-global-services"]
